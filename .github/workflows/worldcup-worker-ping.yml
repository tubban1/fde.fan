name: World Cup Worker Ping

on:
  # The World Cup has ended; keep this workflow manual-only so the Hugging Face
  # worker is not woken up on a schedule.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake worker and trigger overdue sync
        run: |
          curl --fail --show-error --silent --max-time 60 \
            https://wihaha-fde-worldcup-data-worker.hf.space/healthz
