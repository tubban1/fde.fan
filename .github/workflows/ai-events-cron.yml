name: AI Events Crawl

on:
  schedule:
    # GitHub schedules run in UTC. This wakes the job hourly; the script gates the real crawl by interval.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "raw = crawl only, normalize = model pending raw, full = crawl and model, inspect_raw = list suspicious raw"
        required: false
        default: "raw"
      limit_per_source:
        description: "Maximum candidates per source"
        required: false
        default: "12"
      normalize_limit:
        description: "Maximum pending raw rows to normalize per city"
        required: false
        default: "20"
      min_interval_minutes:
        description: "Skip cities crawled successfully within this many minutes"
        required: false
        default: ""
      force:
        description: "Force crawl now, ignoring interval"
        required: false
        default: "true"
      raw_only:
        description: "Legacy compatibility field. Prefer mode=raw."
        required: false
        default: "false"

concurrency:
  group: ai-events-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Crawl AI events
        env:
          DATA_URL: ${{ secrets.DATA_URL }}
          DATA_SSL: ${{ secrets.DATA_SSL || 'true' }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_API_BASE: ${{ secrets.MODEL_API_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          MODEL_API_FORMAT: ${{ vars.MODEL_API_FORMAT || 'generate_content' }}
          AI_EVENTS_FETCH_TIMEOUT_MS: "20000"
          AI_EVENTS_FETCH_CANDIDATE_DETAILS: "1"
          AI_EVENTS_HUODONGXING_MAX_PAGES: ${{ vars.AI_EVENTS_HUODONGXING_MAX_PAGES || '5' }}
          AI_EVENTS_HUODONGXING_LIMIT_PER_SOURCE: ${{ vars.AI_EVENTS_HUODONGXING_LIMIT_PER_SOURCE || '80' }}
          AI_EVENTS_EVENTBRITE_MAX_PAGES: ${{ vars.AI_EVENTS_EVENTBRITE_MAX_PAGES || '3' }}
          AI_EVENTS_EVENTBRITE_LIMIT_PER_SOURCE: ${{ vars.AI_EVENTS_EVENTBRITE_LIMIT_PER_SOURCE || '60' }}
          AI_EVENTS_MEETUP_MAX_PAGES: ${{ vars.AI_EVENTS_MEETUP_MAX_PAGES || '2' }}
          AI_EVENTS_MEETUP_LIMIT_PER_SOURCE: ${{ vars.AI_EVENTS_MEETUP_LIMIT_PER_SOURCE || '60' }}
          AI_EVENTS_LUMA_LIMIT_PER_SOURCE: ${{ vars.AI_EVENTS_LUMA_LIMIT_PER_SOURCE || '80' }}
          AI_EVENTS_SEGMENTFAULT_DETAIL_LIMIT: ${{ vars.AI_EVENTS_SEGMENTFAULT_DETAIL_LIMIT || '40' }}
          AI_EVENTS_SEGMENTFAULT_LIMIT_PER_SOURCE: ${{ vars.AI_EVENTS_SEGMENTFAULT_LIMIT_PER_SOURCE || '40' }}
          AI_EVENTS_MIN_INTERVAL_MINUTES: ${{ github.event.inputs.min_interval_minutes || vars.AI_EVENTS_MIN_INTERVAL_MINUTES || '120' }}
          AI_EVENTS_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' && '1' || '0' }}
          AI_EVENTS_RUN_MODE: ${{ github.event.inputs.mode || vars.AI_EVENTS_RUN_MODE || 'raw' }}
          AI_EVENTS_RAW_ONLY: ${{ (github.event.inputs.mode || vars.AI_EVENTS_RUN_MODE || 'raw') == 'raw' && '1' || '0' }}
          AI_EVENTS_NORMALIZE_LIMIT: ${{ github.event.inputs.normalize_limit || vars.AI_EVENTS_NORMALIZE_LIMIT || '20' }}
        run: |
          LIMIT_PER_SOURCE="${{ github.event.inputs.limit_per_source || '12' }}"
          RUN_MODE="${{ github.event.inputs.mode || vars.AI_EVENTS_RUN_MODE || 'raw' }}"
          NORMALIZE_LIMIT="${{ github.event.inputs.normalize_limit || vars.AI_EVENTS_NORMALIZE_LIMIT || '20' }}"
          pnpm ai-events:migrate-sources
          pnpm ai-events:schema
          pnpm ai-events:migrate-sources
          pnpm ai-events:sync-city-sources
          pnpm ai-events:cleanup
          pnpm ai-events:prune-sources
          if [ "${RUN_MODE}" = "inspect_raw" ]; then
            pnpm ai-events:inspect-raw-quality
            exit 0
          fi
          pnpm ai-events:crawl-all -- --mode="${RUN_MODE}" --limit-per-source="${LIMIT_PER_SOURCE}" --normalize-limit="${NORMALIZE_LIMIT}" --min-interval-minutes="${AI_EVENTS_MIN_INTERVAL_MINUTES}"
